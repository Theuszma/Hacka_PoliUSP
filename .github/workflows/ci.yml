name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo
          POSTGRES_PASSWORD: elo
          POSTGRES_DB: elo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://elo:elo@localhost:5432/elo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Banco de demonstração
        run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
