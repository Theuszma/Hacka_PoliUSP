} }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.p-good { background: var(--good-soft); color: var(--good); }
.p-warn { background: var(--ochre-soft); color: var(--warn); }
.p-accent { background: var(--accent-soft); color: var(--accent); }

/* Buttons & forms */
button, .btn { text-decoration: none; font: inherit; font-weight: 600; font-size: .88rem; border-radius: 7px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brl2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf = (n, d = 0) => new Intl.NumberFormat("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
const pct = (x, d = 0) => nf(x * 100, d) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Métricas mensais de um fluxo, opcionalmente com cenário simulado
function flowMetrics(f, scen) {
  const r = scen ? (scen.r || 0) : 0;
  const useSim = scen ? !!scen.s && !!MATCHES[f.id] : false;
  const perda = f.perda * (1 - r);
  const perdaQtd = f.consumo * perda;
  const destinoValor = useSim ? MATCHES[f.id].oferta : f.destinoValor;
  const destino = useSim ? "simbiose" : f.destino;
  const custoMaterial = perdaQtd * f.custo;                 // dinheiro que virou resíduo
  const saldoDestino = perdaQtd * destinoValor;             // receita (+) ou custo (−) do destino
  const prejuizo = custoMaterial - saldoDestino;
  const co2 = perdaQtd * f.co2;                             // emissões incorporadas no material perdido
  // simbiose evita matéria-prima virgem no parceiro
  const co2Evitado = useSim ? perdaQtd * f.co2 * MATCHES[f.id].substitui : (DESTINOS[destino].circular && destino !== "simbiose" ? perdaQtd * f.co2 * 0.5 : 0);
  return { perda, perdaQtd, custoMaterial, saldoDestino, prejuizo, co2, co2Evitado, destino, circular: DESTINOS[destino].circular, compra: f.consumo * f.custo };
}
function totals(useScenario) {
  let t = { compra: 0, custoMaterial: 0, prejuizo: 0, perdaQtd: 0, circQtd: 0, aterroQtd: 0, co2: 0, co2Evitado: 0 };
  S.flows.forEach(f => {
    const m = flowMetrics(f, useScenario ? S.sim[f.id] : null);
    t.compra += m.compra; t.custoMaterial += m.custoMaterial; t.prejuizo += m.prejuizo;
    t.perdaQtd += m.perdaQtd; t.co2 += m.co2; t.co2Evitado += m.co2Evitado;
    if (m.circular) t.circQtd += m.perdaQtd; else t.aterroQtd += m.perdaQtd;
  });
  t.taxa = t.compra ? t.custoMaterial / t.compra : 0;
  t.circ = t.perdaQtd ? t.circQtd / t.perdaQtd : 0;
  t.co2Liquido = t.co2 - t.co2Evitado;
  return t;
}
function rankedFlows() {
  return S.flows.map(f => ({ f, m: flowMetrics(f) })).sort((a, b) => b.m.prejuizo - a.m.prejuizo);
}
function engineerScores() {
  const ranked = rankedFlows();
  const total = ranked.reduce((s, x) => s + Math.max(0, x.m.prejuizo), 0) || 1;
  return ENGENHEIROS.map(e => {
    let score = 0; const hits = new Set(); let topFlow = null, topVal = 0;
    ranked.forEach(({ f, m }) => {
      const ov = (f.tags || []).filter(t => e.tags.includes(t));
      if (ov.length) {
        const v = (Math.max(0, m.prejuizo) / total) * Math.min(ov.length, 2);
        score += v; ov.forEach(t => hits.add(t));
        if (v > topVal) { topVal = v; topFlow = f; }
      }
    });
    return { e, score, hits, topFlow };
  }).sort((a, b) => b.score - a.score);
}

function netSvg() {
  const partners = Object.entries(MATCHES).map(([id, m]) => ({ id, ...m, flow: S.flows.find(f => f.id === id) }))
    .concat(OFERTAS.map(o => ({ id: o.id, empresa: o.empresa, km: o.km, incoming: true })));
  const W = 560, H = 300, cx = W / 2, cy = H / 2;
  const maxKm = Math.max(...partners.map(p => p.km));
  let out = "";
  partners.forEach((p, i) => {
    const ang = (-Math.PI / 2) + i * (2 * Math.PI / partners.length);
    const rad = 70 + (p.km / maxKm) * 60;
    const x = cx + Math.cos(ang) * rad * 1.6, y = cy + Math.sin(ang) * rad;
    const st = p.incoming ? S.ofertas[p.id] : S.propostas[p.id];
    const color = st ? "var(--good)" : p.incoming ? "var(--ochre)" : "var(--muted)";
    out += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="${st ? 2.5 : 1.2}" ${st ? "" : 'stroke-dasharray="4 4"'}/>`;
    out += `<text class="km" x="${(cx + x) / 2 + 4}" y="${(cy + y) / 2 - 4}">${p.km} km</text>`;
    out += `<circle cx="${x}" cy="${y}" r="7" fill="${color}"/>`;
    const anchor = x < cx - 10 ? "end" : x > cx + 10 ? "start" : "middle";
    const dx = anchor === "end" ? -11 : anchor === "start" ? 11 : 0, dy = anchor === "middle" ? (y < cy ? -12 : 20) : 4;
    out += `<text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}">${esc(p.empresa)}</text>`;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="18" fill="var(--accent)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:var(--accent-ink);font-weight:700">${COMPANY.short}</text>`;
  return `<svg class="net-svg" viewBox="-40 -10 ${W + 80} ${H + 30}" role="img" aria-label="Mapa esquemático da rede de simbiose ao redor da empresa">${out}</svg>`;
}

    <div class="view-head"><div><span class="label">Simbiose industrial</span><h2>O resíduo de uma indústria é o insumo de outra</h2>
      <p>O Elo cruza o que cada empresa descarta com o que outras compram, por tipo de material, volume e distância. Quanto mais perto, menor o frete e a emissão do transporte.</p></div></div>
    <div class="grid g-main">
      <div class="panel"><div class="panel-head"><h3>Sua rede num raio de 15 km</h3>
        <div class="legend"><span><i style="background:var(--muted)"></i>Compatível</span><span><i style="background:var(--ochre)"></i>Oferta para você</span><span><i style="background:var(--good)"></i>Em negociação</span></div></div>${netSvg()}</div>
      <div class="panel" style="display:grid;gap:10px;align-content:start">
        <span class="label">Como o match é feito</span>
        <p class="small">1. Classificação do resíduo (material, pureza, forma).</p>
        <p class="small">2. Busca por empresas que compram esse material como insumo.</p>
        <p class="small">3. Filtro de volume mínimo e capacidade do comprador.</p>
        <p class="small">4. Ordenação por ganho líquido menos frete estimado.</p>
        <p class="small muted">Resíduos perigosos (Classe I) só vão para destinatários com licença ambiental (CETESB/ANP).</p>
      </div>
    </div>
    <div><h3 style="margin-bottom:12px">Seus resíduos que outras empresas querem</h3><div class="cards">${saida}</div></div>
    <div><h3 style="margin-bottom:12px">Resíduos de outras empresas que viram insumo para você</h3><div class="cards">${entrada}</div></div>
  </section>`;
}

function viewEngenheiros() {
  const scored = engineerScores();
  const top = rankedFlows()[0];
  const cards = scored.map((x, i) => {
    const e = x.e, best = i === 0;
    const tags = e.tags.map(t => `<span class="tag${x.hits.has(t) ? " hit" : ""}">${esc(t)}</span>`).join("");
    const pedido = S.demandas.find(d => d.empresa === COMPANY.name && d.convidado === e.id);
    return `<div class="card${best ? " best" : ""}">
      ${best ? `<span class="ribbon">Melhor match para sua maior perda</span>` : ""}
      <div class="head"><div class="avatar" style="background:${e.tipo.startsWith("Mentor") ? "var(--ochre)" : "var(--ink)"}">${e.nome.split(" ").map(s => s[0]).join("")}</div>
        <div><b>${esc(e.nome)}</b><div class="small muted">${esc(e.curso)}</div></div></div>
      <div>${tags}</div>
      <div class="meta"><span>Perfil<b>${esc(e.tipo)}</b></span><span>Disponível<b>${e.horas} h/semana</b></span>
        <span>Avaliação<b>${nf(e.nota, 1)} / 5</b></span><span>Projetos<b>${e.projetos}</b></span></div>
      <div class="foot"><span class="small muted">${x.topFlow ? "Pode ajudar com: " + esc(x.topFlow.material) : "Sem relação direta com seus insumos"}</span>
        <button type="button" data-convidar="${e.id}" class="${best && !pedido ? "primary" : ""}" ${pedido ? "disabled" : ""}>${pedido ? "Convite enviado" : "Convidar"}</button></div>
    </div>`;
  }).join("");
  const minhas = S.demandas.filter(d => d.empresa === COMPANY.name);
  const minhasHtml = minhas.length ? minhas.map(d => `<tr><td><b>${esc(d.titulo)}</b><span class="sub">${esc(d.area)}</span></td><td>${statusPill(d)}</td><td>${esc(d.resp || "—")}</td></tr>`).join("")
    : "";
  return `<section class="view">
    <div class="view-head"><div><span class="label">Conexão com a engenharia</span><h2>Engenheiros e estudantes da Poli para o seu problema</h2>
      <p>O match usa as áreas técnicas de cada pessoa e pondera pelo prejuízo de cada insumo. Estudantes atuam com supervisão de mentores e contam as horas como extensão universitária.</p></div>
      <button type="button" class="primary" id="open-request">Pedir apoio técnico</button></div>
    <div class="panel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><span class="label">Sua maior perda</span><p><b>${esc(top.f.material)}</b> · ${brl.format(top.m.prejuizo * 12)}/ano · ${pct(top.f.perda)} de perda</p></div>
      <div class="small muted" style="flex:2;min-width:220px">Áreas procuradas: ${(top.f.tags || []).map(t => `<span class="tag hit">${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="cards">${cards}</div>
    <div class="panel"><div class="panel-head"><h3>Seus pedidos de apoio</h3></div>
      ${minhas.length ? `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Status</th><th>Responsável</th></tr></thead><tbody>${minhasHtml}</tbody></table></div>`
        : `<div class="empty">Nenhum pedido ainda. Use "Pedir apoio técnico" e o Elo monta o briefing a partir do seu diagnóstico.</div>`}
    </div>
  </section>`;
}
function statusPill(d) {
  return d.status === "aberta" ? `<span class="pill p-accent">Aberta</span>` : d.status === "em andamento" ? `<span class="pill p-warn">Em andamento</span>` : `<span class="pill p-good">Concluída</span>`;
}

function viewDemandas() {
  const assumidas = S.demandas.filter(d => d.resp === "Você");
  const horas = assumidas.reduce((s, d) => s + d.horas, 0);
  const rows = S.demandas.slice().sort((a, b) => (a.status === "aberta" ? 0 : 1) - (b.status === "aberta" ? 0 : 1)).map(d => `
    <div class="card${d.empresa === COMPANY.name && d.status === "aberta" ? " best" : ""}">
      ${d.empresa === COMPANY.name && d.status === "aberta" ? `<span class="ribbon">Nova demanda</span>` : ""}
      <div class="row" style="justify-content:space-between"><span class="label">${esc(d.area)}</span>${statusPill(d)}</div>
      <b>${esc(d.titulo)}</b>
      <div class="small muted">${esc(d.empresa)} · ${esc(d.local)}</div>
      <div class="meta"><span>Prejuízo da empresa<b>${brl.format(d.prejuizo * 12)}/ano</b></span><span>Esforço estimado<b>${d.horas} h de extensão</b></span></div>
      <div class="foot"><span class="small muted">${d.resp ? "Com: " + esc(d.resp) : "Sem responsável"}</span>
        ${d.status === "aberta" ? `<button type="button" class="primary" data-assumir="${d.id}">Assumir demanda</button>` : d.resp === "Você" && d.status === "em andamento" ? `<button type="button" data-concluir="${d.id}">Marcar como concluída</button>` : ""}</div>
    </div>`).join("");
  return `<section class="view">
    <div class="view-head"><div><span class="label">Visão do estudante ou engenheiro voluntário</span><h2>Demandas de PMEs perto de você</h2>
      <p>Cada demanda chega com o diagnóstico da empresa. Ao assumir, o estudante monta a equipe com um mentor e as horas entram como atividade de extensão.</p></div></div>
    <div class="grid g-3">
      ${kpi("Demandas abertas", S.demandas.filter(d => d.status === "aberta").length, "esperando um engenheiro", true)}
      ${kpi("Assumidas por você", assumidas.length, assumidas.length ? assumidas.map(d => esc(d.empresa)).join(", ") : "nenhuma ainda")}
      ${kpi("Horas de extensão", horas + " h", "previstas nas demandas que você assumiu")}
    </div>
    <div class="cards">${rows}</div>
  </section>`;
}

function viewImpacto() {
  const t = totals(false);
  const ods = [
    { n: 9, c: "#FD6925", t: "Indústria, inovação e infraestrutura", meta: "9.4", d: "Modernizar a indústria com uso mais eficiente de recursos e tecnologias limpas." },
    { n: 12, c: "#BF8B2E", t: "Consumo e produção responsáveis", meta: "12.2 · 12.5", d: "Uso eficiente de recursos naturais e redução substancial da geração de resíduos por reciclagem e reuso." },
    { n: 13, c: "#3F7E44", t: "Ação contra a mudança do clima", meta: "13.2", d: "Emissões evitadas pela substituição de matéria-prima virgem." },
    { n: 4, c: "#C5192D", t: "Educação de qualidade", meta: "4.4", d: "Estudantes de engenharia aplicando conhecimento técnico em problemas reais." }
  ];
  return `<section class="view">
    <div class="view-head"><div><span class="label">Rede Elo · piloto ABC Paulista</span><h2>Impacto da rede</h2>
      <p>Indicadores que a plataforma acompanha para cada empresa e para a rede inteira, ligados às metas da Agenda 2030.</p></div></div>
    <div class="grid g-4">
      ${kpi("PMEs na rede", "27", "piloto: São Bernardo, Diadema, Santo André, Mauá")}
      ${kpi("Engenheiros e estudantes", "41", "12 mentores formados e 29 estudantes")}
      ${kpi("Resíduo desviado do aterro", "184 t", "nos primeiros 6 meses do piloto")}
      ${kpi("Economia gerada às PMEs", "R$ 612 mil", "por ano, somando trocas e melhorias")}
    </div>
    <div class="grid g-2">
      ${ods.map(o => `<div class="panel" style="display:flex;gap:14px;align-items:flex-start"><span class="ods" style="background:${o.c}">${o.n}</span>
        <div><b>ODS ${o.n} · ${o.t}</b><div class="small muted">Meta ${o.meta}</div><p class="small" style="margin-top:4px">${o.d}</p></div></div>`).join("")}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Esta empresa hoje</h3></div>
      <div class="grid g-3">
        <div><span class="label">Prejuízo anual com resíduos</span><p class="num" style="font-size:1.3rem">${brl.format(t.prejuizo * 12)}</p></div>
        <div><span class="label">CO₂e incorporado no desperdício</span><p class="num" style="font-size:1.3rem">${nf(t.co2 * 12 / 1000, 1)} t/ano</p></div>
        <div><span class="label">Circularidade</span><p class="num" style="font-size:1.3rem">${pct(t.circ)}</p></div>
      </div>
    </div>
    <p class="small muted">Números da rede são ilustrativos para a demonstração do protótipo.</p>
  </section>`;
}

/* ============================================================
   ROTEAMENTO E EVENTOS
   ============================================================ */
function current() { const h = location.hash.replace("#", ""); return VIEWS.includes(h) ? h : "diagnostico"; }
function render() {
  const v = current();
  document.getElementById("co-name").textContent = COMPANY.name;
  document.getElementById("co-meta").textContent = COMPANY.porte + " · " + COMPANY.local;
  document.getElementById("co-avatar").textContent = COMPANY.short;
  document.querySelectorAll("#tabs a").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const open = S.demandas.filter(d => d.status === "aberta").length;
  const oc = document.getElementById("open-count"); oc.textContent = open; oc.hidden = !open;
  const fn = { diagnostico: viewDiagnostico, simulador: viewSimulador, simbiose: viewSimbiose, engenheiros: viewEngenheiros, demandas: viewDemandas, impacto: viewImpacto }[v];
  app.innerHTML = fn() + `<div class="demo-note" style="margin-top:24px"><span>Protótipo Hack@Poli 2026 · dados de exemplo de uma empresa fictícia</span><button type="button" class="ghost" id="reset-demo">Reiniciar demonstração</button></div>`;
}
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

app.addEventListener("input", ev => {
  const id = ev.target.dataset.sim;
  if (id) {
    S.sim[id] = Object.assign({ r: 0, s: false }, S.sim[id], { r: Number(ev.target.value) / 100 });
    save(); rerenderKeepScroll();
    const el = document.getElementById("r-" + id); if (el) el.focus();
  }
});
app.addEventListener("change", ev => {
  const id = ev.target.dataset.simb;
  if (id) { S.sim[id] = Object.assign({ r: 0, s: false }, S.sim[id], { s: ev.target.checked }); save(); rerenderKeepScroll(); }
});
app.addEventListener("submit", ev => {
  if (ev.target.id !== "add-flow") return;
  ev.preventDefault();
  const v = id => document.getElementById(id).value;
  const tipo = v("af-tipo"), p = PRESETS[tipo];
  const f = {
    id: "u" + Date.now(), material: v("af-mat").trim(), tipo, unidade: p.unidade,
    consumo: Number(v("af-cons")), custo: Number(v("af-custo")), perda: Math.min(1, Number(v("af-perda")) / 100),
    destino: v("af-dest"), destinoValor: Number(v("af-dv")) || 0, fornecedor: "Cadastrado agora", co2: p.co2, tags: p.tags, alavanca: null
  };
  if (!f.material || !(f.consumo > 0)) return;
  S.flows.push(f); save(); rerenderKeepScroll(); toast(`${f.material} entrou no diagnóstico`);
});
app.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.id === "reset-demo") { S = freshState(); save(); render(); window.scrollTo(0, 0); toast("Demonstração reiniciada"); return; }
  if (b.id === "sim-typical") { S.flows.forEach(f => { if (f.alavanca) S.sim[f.id] = Object.assign({ s: false }, S.sim[f.id], { r: f.alavanca.reducaoTipica }); if (MATCHES[f.id]) S.sim[f.id].s = true; }); save(); rerenderKeepScroll(); return; }
  if (b.id === "sim-reset") { S.sim = {}; save(); rerenderKeepScroll(); return; }
  if (b.dataset.propor) { S.propostas[b.dataset.propor] = "enviada"; save(); rerenderKeepScroll(); toast("Proposta enviada para " + MATCHES[b.dataset.propor].empresa); return; }
  if (b.dataset.oferta) { S.ofertas[b.dataset.oferta] = "interesse"; save(); rerenderKeepScroll(); toast("Interesse enviado"); return; }
  if (b.id === "open-request") { openRequest(null); return; }
  if (b.dataset.convidar) { openRequest(b.dataset.convidar); return; }
  if (b.dataset.assumir) { const d = S.demandas.find(x => x.id === b.dataset.assumir); d.status = "em andamento"; d.resp = "Você"; save(); rerenderKeepScroll(); toast(`Você assumiu: ${d.empresa}`); return; }
  if (b.dataset.concluir) { const d = S.demandas.find(x => x.id === b.dataset.concluir); d.status = "concluída"; save(); rerenderKeepScroll(); toast("Demanda concluída"); return; }
});

/* Pedido de apoio com briefing automático */
function briefing() {
  const t = totals(false), r = rankedFlows();
  const lines = r.slice(0, 3).map(({ f, m }, i) => `${i + 1}. ${f.material}: perda de ${pct(f.perda)} (${nf(m.perdaQtd)} ${f.unidade}/mês), destino atual ${DESTINOS[f.destino].label.toLowerCase()}, prejuízo ${brl.format(m.prejuizo)}/mês.`);
  return `Empresa: ${COMPANY.name} (${COMPANY.porte}, ${COMPANY.local})
Setor: ${COMPANY.setor}

Situação atual
- Prejuízo com resíduos: ${brl.format(t.prejuizo)}/mês (${pct(t.taxa, 1)} do valor comprado em insumos)
- Circularidade: ${pct(t.circ)} · CO2e no desperdício: ${nf(t.co2 / 1000, 1)} t/mês

Principais perdas
${lines.join("\n")}

O que precisamos
Avaliar a causa da perda de ${r[0].f.material} e propor melhorias de processo com estimativa de investimento e retorno.`;
}
function openRequest(engId) {
  const top = rankedFlows()[0].f;
  const e = engId ? ENGENHEIROS.find(x => x.id === engId) : null;
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-bg" id="mbg"><form class="modal" id="req-form" role="dialog" aria-modal="true" aria-labelledby="req-title">
    <div><span class="label">Pedido de apoio técnico</span><h3 id="req-title">${e ? "Convidar " + esc(e.nome) : "Abrir demanda para a rede de engenheiros"}</h3></div>
    <div class="field"><label for="req-titulo">Título</label><input id="req-titulo" value="${esc("Reduzir perda de " + top.material + " (" + pct(top.perda) + ")")}"></div>
    <div class="field"><label for="req-brief">Briefing gerado a partir do diagnóstico</label><textarea id="req-brief">${esc(briefing())}</textarea></div>
    <div class="row" style="justify-content:flex-end"><button type="button" id="req-cancel">Cancelar</button><button type="submit" class="primary">${e ? "Enviar convite" : "Publicar demanda"}</button></div>
  </form></div>`;
  document.getElementById("req-titulo").focus();
  const close = () => { root.innerHTML = ""; };
  document.getElementById("req-cancel").onclick = close;
  document.getElementById("mbg").addEventListener("click", ev => { if (ev.target.id === "mbg") close(); });
  document.getElementById("req-form").addEventListener("submit", ev => {
    ev.preventDefault();
    const t = totals(false);
    S.demandas.unshift({ id: "m" + Date.now(), empresa: COMPANY.name, local: COMPANY.local, area: (top.tags || ["processos"])[0], titulo: document.getElementById("req-titulo").value,
      briefing: document.getElementById("req-brief").value, horas: 12, status: "aberta", resp: null, prejuizo: t.prejuizo, convidado: e ? e.id : null });
    save(); close(); rerenderKeepScroll(); toast(e ? `Convite enviado para ${e.nome}` : "Demanda publicada no painel dos engenheiros");
  });
  document.addEventListener("keydown", function esc(ev) { if (ev.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
}

render();
</script>
